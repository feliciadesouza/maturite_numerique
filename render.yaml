# Blueprint Render — https://render.com/docs/blueprint-spec
# Depuis le tableau de bord Render : New + > Blueprint > sélectionner ce dépôt.
databases:
  - name: maturite-db
    plan: free
    databaseName: maturite_numerique
    user: maturite

services:
  - type: web
    name: maturite-numerique
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: maturite-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # ALLOWED_HOSTS accepte le point initial comme joker de sous-domaine.
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@maturite-numerique.tg
      # À renseigner dans le tableau de bord Render (valeur secrète).
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # Générer le jeu de démonstration au premier déploiement : mettre 1,
      # déployer, puis remettre à vide (sinon les données sont réinitialisées
      # à chaque redémarrage).
      - key: SEED_DEMO
        value: ""
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend

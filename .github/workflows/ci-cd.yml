name: CI/CD - Maturité Numérique

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Quality checks
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: maturite_numerique
    env:
      DJANGO_SETTINGS_MODULE: maturite_numerique.settings
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: maturite_numerique/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r ../requirements-dev.txt

      - name: Django system check
        run: python manage.py check

      - name: Lint Python sources
        run: flake8 .

      - name: Security scan (bandit)
        run: bandit --recursive --quiet core maturite_numerique --exclude '**/tests.py,**/migrations/**,**/seed_demo.py'

      - name: Run tests
        run: python manage.py test

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Compile Python sources
        run: python -m compileall .

  build-image:
    name: Build container image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/maturite-numerique:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/maturite-numerique:latest

  deploy:
    name: Deploy
    needs: build-image
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Info
        run: |
          echo "Le déploiement est géré par Render (blueprint render.yaml, autoDeploy)."
          echo "Render reconstruit et redéploie à chaque push sur master."
          echo "Ce job ne fait que documenter la chaîne ; l'image est aussi"
          echo "publiée sur ghcr.io par le job build-image pour un autre hébergeur."

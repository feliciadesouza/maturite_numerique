# Blueprint Render — https://render.com/docs/blueprint-spec
# Depuis le tableau de bord Render : New + > Blueprint > sélectionner ce dépôt.
#
# La base de données est hébergée sur Neon (PostgreSQL gratuit, sans expiration).
# Après création du service, coller la chaîne de connexion Neon dans la variable
# DATABASE_URL (tableau de bord Render > Environment).
services:
  - type: web
    name: maturite-numerique
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # postgres://user:pwd@ep-xxx-pooler.<region>.aws.neon.tech/dbname?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # ALLOWED_HOSTS accepte le point initial comme joker de sous-domaine.
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@maturite-numerique.tg
      # À renseigner dans le tableau de bord Render (valeur secrète).
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # Générer le jeu de démonstration au premier déploiement : mettre 1,
      # déployer, puis remettre à vide (sinon les données sont réinitialisées
      # à chaque redémarrage).
      - key: SEED_DEMO
        value: ""
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      # Gunicorn : dimensionné pour les 512 Mo de l'offre gratuite.
      # 2 workers x 4 threads ; à monter si l'on passe sur un plan payant.
      - key: WEB_CONCURRENCY
        value: "2"
      - key: WEB_THREADS
        value: "4"

{% comment %} Bandeau navy d'en-tête. Params : eyebrow, titre, sous_titre {% endcomment %}
<section class="page-banner">
  <svg class="page-banner__decor" viewBox="0 0 1440 320" preserveAspectRatio="xMidYMid slice"
       aria-hidden="true" focusable="false">
    <defs>
      <pattern id="pb-dots" width="26" height="26" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="2" fill="rgba(255,255,255,0.14)"/>
      </pattern>
    </defs>
    <rect x="64" y="30" width="224" height="160" fill="url(#pb-dots)"/>
    <polygon points="1300,36 1414,120 1370,252 1230,252 1186,120"
             fill="none" stroke="rgba(255,255,255,0.13)" stroke-width="1.5"/>
    <polygon points="1300,94 1374,148 1345,234 1255,234 1226,148"
             fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <circle cx="338" cy="120" r="6" fill="#3E90F0"/>
    <circle cx="1150" cy="222" r="6" fill="#F2B33D"/>
  </svg>
  <div class="inner">
    <span class="eyebrow">{{ eyebrow }}</span>
    <h1>{{ titre }}</h1>
    {% if sous_titre %}<p>{{ sous_titre }}</p>{% endif %}
  </div>
</section>

{% comment %} Params : distribution ({0..5: effectif}), total_agents {% endcomment %}
<div class="dist-chart">
  {% for niveau, effectif in distribution.items %}
  <div class="dist-col">
    <span class="dist-col__v">{{ effectif }}</span>
    <span class="dist-col__bar" style="height: {% if dist_max %}{% widthratio effectif dist_max 150 %}{% else %}3{% endif %}px;"></span>
    <span class="dist-col__n">N{{ niveau }}</span>
  </div>
  {% endfor %}
</div>
<p class="text-muted text-sm" style="margin-top: var(--sp-3);">N0 non initié N5 expert {{ total_agents }} agent{{ total_agents|pluralize }} classé{{ total_agents|pluralize }}</p>
